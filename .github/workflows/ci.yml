name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run secrets:scan
      # Skipped until the base branch has the fragment check, so the PR that adds it can pass.
      - if: github.event_name == 'pull_request'
        run: |
          if git cat-file -e "origin/${GITHUB_BASE_REF}:scripts/changelog-cli.ts" 2>/dev/null; then npm run changelog:check
          else echo "base has no changelog check yet"; fi
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  website-lighthouse:
    # Issue #80: the website scores 90+ in every Lighthouse category on mobile.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @karatos/core && node --import tsx site/build.ts
      - run: |
          node site/server.ts &
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 0.5; done
          # Three runs, judged on the median: one run on a shared runner can swing by ten points.
          for run in 1 2 3; do
            npx --yes lighthouse@12.8.2 http://127.0.0.1:8080/ --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lighthouse-$run.json
          done
          node site/lighthouse.ts lighthouse-1.json lighthouse-2.json lighthouse-3.json

  instance-smoke-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: docker build -t karatos-brain:ci .
      - run: scripts/smoke-test.sh
        env:
          IMAGE: karatos-brain:ci
          DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, instance-smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
