name: Nightly sandbox run

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: sandbox-run
  cancel-in-progress: false

jobs:
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @karatos/core -w @karatos/connectors
      - run: npm run sandbox:run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Test-only sandbox credentials, one line per credential a check in
          # scripts/sandbox-checks/<id>.ts declares. Never a client's account.
          # registry:sandbox-env:start
          # Generated by npm run registry:write from each check in scripts/sandbox-checks/. Edit those, not this block.
          SANDBOX_AFFIRM_PUBLIC_API_KEY: ${{ secrets.SANDBOX_AFFIRM_PUBLIC_API_KEY }}
          SANDBOX_AFFIRM_PRIVATE_API_KEY: ${{ secrets.SANDBOX_AFFIRM_PRIVATE_API_KEY }}
          SANDBOX_AFFIRM_MERCHANT_ID: ${{ secrets.SANDBOX_AFFIRM_MERCHANT_ID }}
          SANDBOX_AUTHORIZE_NET_API_LOGIN_ID: ${{ secrets.SANDBOX_AUTHORIZE_NET_API_LOGIN_ID }}
          SANDBOX_AUTHORIZE_NET_TRANSACTION_KEY: ${{ secrets.SANDBOX_AUTHORIZE_NET_TRANSACTION_KEY }}
          SANDBOX_AVALARA_ACCOUNT_ID: ${{ secrets.SANDBOX_AVALARA_ACCOUNT_ID }}
          SANDBOX_AVALARA_LICENSE_KEY: ${{ secrets.SANDBOX_AVALARA_LICENSE_KEY }}
          SANDBOX_BIGCOMMERCE_STORE_HASH: ${{ secrets.SANDBOX_BIGCOMMERCE_STORE_HASH }}
          SANDBOX_BIGCOMMERCE_ACCESS_TOKEN: ${{ secrets.SANDBOX_BIGCOMMERCE_ACCESS_TOKEN }}
          SANDBOX_CALENDLY_ACCESS_TOKEN: ${{ secrets.SANDBOX_CALENDLY_ACCESS_TOKEN }}
          SANDBOX_CLOVER_MERCHANT_ID: ${{ secrets.SANDBOX_CLOVER_MERCHANT_ID }}
          SANDBOX_CLOVER_API_TOKEN: ${{ secrets.SANDBOX_CLOVER_API_TOKEN }}
          SANDBOX_CLOVER_CUSTOMER_REF_KEY: ${{ secrets.SANDBOX_CLOVER_CUSTOMER_REF_KEY }}
          SANDBOX_CUSTOM_FORMS_TYPEFORM_TOKEN: ${{ secrets.SANDBOX_CUSTOM_FORMS_TYPEFORM_TOKEN }}
          SANDBOX_CUSTOM_FORMS_TYPEFORM_FORM_ID: ${{ secrets.SANDBOX_CUSTOM_FORMS_TYPEFORM_FORM_ID }}
          SANDBOX_GIA_API_URL: ${{ secrets.SANDBOX_GIA_API_URL }}
          SANDBOX_GIA_API_KEY: ${{ secrets.SANDBOX_GIA_API_KEY }}
          SANDBOX_GMAIL_CLIENT_ID: ${{ secrets.SANDBOX_GMAIL_CLIENT_ID }}
          SANDBOX_GMAIL_CLIENT_SECRET: ${{ secrets.SANDBOX_GMAIL_CLIENT_SECRET }}
          SANDBOX_GMAIL_REFRESH_TOKEN: ${{ secrets.SANDBOX_GMAIL_REFRESH_TOKEN }}
          SANDBOX_GOOGLE_WORKSPACE_CLIENT_ID: ${{ secrets.SANDBOX_GOOGLE_WORKSPACE_CLIENT_ID }}
          SANDBOX_GOOGLE_WORKSPACE_CLIENT_SECRET: ${{ secrets.SANDBOX_GOOGLE_WORKSPACE_CLIENT_SECRET }}
          SANDBOX_GOOGLE_WORKSPACE_REFRESH_TOKEN: ${{ secrets.SANDBOX_GOOGLE_WORKSPACE_REFRESH_TOKEN }}
          SANDBOX_GOOGLE_WORKSPACE_FOLDER_ID: ${{ secrets.SANDBOX_GOOGLE_WORKSPACE_FOLDER_ID }}
          SANDBOX_GOOGLE_WORKSPACE_SHEETS_RANGE: ${{ secrets.SANDBOX_GOOGLE_WORKSPACE_SHEETS_RANGE }}
          SANDBOX_HUBSPOT_ACCESS_TOKEN: ${{ secrets.SANDBOX_HUBSPOT_ACCESS_TOKEN }}
          SANDBOX_KLAVIYO_PRIVATE_API_KEY: ${{ secrets.SANDBOX_KLAVIYO_PRIVATE_API_KEY }}
          SANDBOX_MAILCHIMP_API_KEY: ${{ secrets.SANDBOX_MAILCHIMP_API_KEY }}
          SANDBOX_METALS_API_KEY: ${{ secrets.SANDBOX_METALS_API_KEY }}
          SANDBOX_MONDAY_API_TOKEN: ${{ secrets.SANDBOX_MONDAY_API_TOKEN }}
          SANDBOX_PLAID_CLIENT_ID: ${{ secrets.SANDBOX_PLAID_CLIENT_ID }}
          SANDBOX_PLAID_SECRET: ${{ secrets.SANDBOX_PLAID_SECRET }}
          SANDBOX_PLAID_ACCESS_TOKEN: ${{ secrets.SANDBOX_PLAID_ACCESS_TOKEN }}
          SANDBOX_QUICKBOOKS_CLIENT_ID: ${{ secrets.SANDBOX_QUICKBOOKS_CLIENT_ID }}
          SANDBOX_QUICKBOOKS_CLIENT_SECRET: ${{ secrets.SANDBOX_QUICKBOOKS_CLIENT_SECRET }}
          SANDBOX_QUICKBOOKS_REALM_ID: ${{ secrets.SANDBOX_QUICKBOOKS_REALM_ID }}
          SANDBOX_QUICKBOOKS_REFRESH_TOKEN: ${{ secrets.SANDBOX_QUICKBOOKS_REFRESH_TOKEN }}
          SANDBOX_SHOPIFY_SHOP_DOMAIN: ${{ secrets.SANDBOX_SHOPIFY_SHOP_DOMAIN }}
          SANDBOX_SHOPIFY_CLIENT_ID: ${{ secrets.SANDBOX_SHOPIFY_CLIENT_ID }}
          SANDBOX_SHOPIFY_CLIENT_SECRET: ${{ secrets.SANDBOX_SHOPIFY_CLIENT_SECRET }}
          SANDBOX_SLACK_BOT_TOKEN: ${{ secrets.SANDBOX_SLACK_BOT_TOKEN }}
          SANDBOX_SQUARE_APPLICATION_ID: ${{ secrets.SANDBOX_SQUARE_APPLICATION_ID }}
          SANDBOX_SQUARE_APPLICATION_SECRET: ${{ secrets.SANDBOX_SQUARE_APPLICATION_SECRET }}
          SANDBOX_SQUARE_REFRESH_TOKEN: ${{ secrets.SANDBOX_SQUARE_REFRESH_TOKEN }}
          SANDBOX_STRIPE_SECRET_KEY: ${{ secrets.SANDBOX_STRIPE_SECRET_KEY }}
          SANDBOX_TWILIO_ACCOUNT_SID: ${{ secrets.SANDBOX_TWILIO_ACCOUNT_SID }}
          SANDBOX_TWILIO_API_KEY_SID: ${{ secrets.SANDBOX_TWILIO_API_KEY_SID }}
          SANDBOX_TWILIO_API_KEY_SECRET: ${{ secrets.SANDBOX_TWILIO_API_KEY_SECRET }}
          SANDBOX_WIX_APP_ID: ${{ secrets.SANDBOX_WIX_APP_ID }}
          SANDBOX_WIX_APP_SECRET: ${{ secrets.SANDBOX_WIX_APP_SECRET }}
          SANDBOX_WIX_INSTANCE_ID: ${{ secrets.SANDBOX_WIX_INSTANCE_ID }}
          SANDBOX_WOOCOMMERCE_STORE_URL: ${{ secrets.SANDBOX_WOOCOMMERCE_STORE_URL }}
          SANDBOX_WOOCOMMERCE_CONSUMER_KEY: ${{ secrets.SANDBOX_WOOCOMMERCE_CONSUMER_KEY }}
          SANDBOX_WOOCOMMERCE_CONSUMER_SECRET: ${{ secrets.SANDBOX_WOOCOMMERCE_CONSUMER_SECRET }}
          SANDBOX_XERO_CLIENT_ID: ${{ secrets.SANDBOX_XERO_CLIENT_ID }}
          SANDBOX_XERO_CLIENT_SECRET: ${{ secrets.SANDBOX_XERO_CLIENT_SECRET }}
          SANDBOX_XERO_TENANT_ID: ${{ secrets.SANDBOX_XERO_TENANT_ID }}
          SANDBOX_XERO_REFRESH_TOKEN: ${{ secrets.SANDBOX_XERO_REFRESH_TOKEN }}
          # registry:sandbox-env:end
