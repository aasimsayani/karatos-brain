name: Vendor docs watch

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @karatos/core -w @karatos/connector-testkit
      # Snapshots from the last run. A cache miss just takes a new baseline.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .docs-watch
          key: docs-watch-${{ github.run_id }}
          restore-keys: docs-watch-
      - run: npm run docs:watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
