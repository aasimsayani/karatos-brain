name: Vendor docs watch

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: docs-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @karatos/core -w @karatos/connector-testkit
      # Snapshots from the last run. A cache miss just takes a new baseline.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .docs-watch
          key: docs-watch-${{ github.run_id }}
          restore-keys: docs-watch-
      - run: npm run docs:watch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
